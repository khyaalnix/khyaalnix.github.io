name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'           # Matches v1.0.0, v2.1.3, etc. (main branch tags)
      - 'v[0-9]+.beta.[0-9]+'             # Matches v1.beta.1, v2.beta.5, etc. (develop branch tags)
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag (if tag triggered)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_NAME"

          # Check if it's a beta tag (should be from develop)
          if [[ $TAG_NAME =~ ^v[0-9]+\.beta\.[0-9]+$ ]]; then
            echo "Beta tag detected: $TAG_NAME"
            # Verify it's from develop branch
            BRANCH=$(git branch -r --contains ${{ github.sha }} | grep -E 'origin/develop$' || echo "")
            if [ -z "$BRANCH" ]; then
              echo "Error: Beta tags (v*.beta.*) must be pushed from develop branch"
              exit 1
            fi
          # Check if it's a release tag (should be from main)
          elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag detected: $TAG_NAME"
            # Verify it's from main branch
            BRANCH=$(git branch -r --contains ${{ github.sha }} | grep -E 'origin/main$' || echo "")
            if [ -z "$BRANCH" ]; then
              echo "Error: Release tags (v*.*.*) must be pushed from main branch"
              exit 1
            fi
          else
            echo "Error: Invalid tag format. Use v1.0.0 for releases or v1.beta.0 for beta"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    # Only deploy on main branch pushes, version tags, or manual triggers (not PRs)
    if: |
      github.event_name != 'pull_request' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
